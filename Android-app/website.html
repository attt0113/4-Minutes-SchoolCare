<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 Minutes SchoolCare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
      }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .nav-card { transition: all 0.2s ease; }
        .nav-card:active { transform: scale(0.96); }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sos-pulse { animation: sos-pulse 2s infinite; }
        @keyframes sos-pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen shadow-2xl bg-slate-50 relative border-x border-slate-200 overflow-x-hidden">

    <div id="app" class="pb-24 min-h-screen flex flex-col"></div>

    <nav id="bottom-nav" class="fixed bottom-0 max-w-[448px] w-full glass border-t border-slate-200 flex justify-around py-4 px-6 z-50 hidden transition-all duration-300">
        <button onclick="navigate('dashboard')" class="flex flex-col items-center nav-item" data-screen="dashboard"><i data-lucide="layout-grid" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-bold uppercase">Home</span></button>
        <button onclick="navigate('notifications')" class="flex flex-col items-center nav-item text-slate-400" data-screen="notifications"><i data-lucide="bell" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">Alerts</span></button>
        <button onclick="navigate('emergency')" class="flex flex-col items-center nav-item text-red-500" data-screen="emergency"><i data-lucide="shield-alert" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-bold uppercase">SOS</span></button>
        <button onclick="navigate('alerts')" class="flex flex-col items-center nav-item text-slate-400" data-screen="alerts"><i data-lucide="activity" class="w-6 h-6"></i><span class="text-[10px] mt-1 font-medium">Stats</span></button>
    </nav>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";
        import { initializeApp } from "firebase/app";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyCRJ35b_zndqXSmXzhgjvGuoS7TNgvRLeo",
            authDomain: "minutes-732a0.firebaseapp.com",
            projectId: "minutes-732a0",
            storageBucket: "minutes-732a0.firebasestorage.app",
            messagingSenderId: "1038070237578",
            appId: "1:1038070237578:web:b1d8e146200f8087732a0"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);
        const genAI = new GoogleGenerativeAI("AIzaSyCHD_VSglccRChEjPPeK5BqtW4vQFmcPE4");

        let state = {
            screen: 'login', students: [], uploadedPhoto: null,
            topMatches: [], selectedStudent: null, aiSteps: [],
            isAiLoading: false, isModelsLoaded: false
        };

        async function loadModels() {
            const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
            try {
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                state.isModelsLoaded = true;
            } catch (e) { console.error("Face models failed to load", e); }
        }
        loadModels();

        // 核心修改：简化查询以避开非现存集合的索引权限问题
        async function fetchStudents() {
            try {
                const snap = await getDocs(collection(db, "students"));
                state.students = [];
                snap.forEach(doc => state.students.push(doc.data()));
                // 本地排序
                state.students.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                render();
            } catch (e) {
                console.error("Firestore Fetch Failed: ", e.message);
                // 如果失败，尝试从本地读取（作为备选）
                state.students = JSON.parse(localStorage.getItem('registered_students') || '[]');
                render();
            }
        }
        fetchStudents();

        async function compressImage(base64Str) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 200; // 深度压缩
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', 0.4));
                };
            });
        }

        window.navigate = (screen, params = {}) => {
            state.screen = screen; Object.assign(state, params); render(); window.scrollTo(0, 0);
        };

        function render() {
            const app = document.getElementById('app');
            const nav = document.getElementById('bottom-nav');
            nav.classList.toggle('hidden', state.screen === 'login' || state.screen === 'emergency_active');

            switch(state.screen) {
                case 'login': app.innerHTML = renderLogin(); break;
                case 'dashboard': app.innerHTML = renderDashboard(); break;
                case 'add-profile': app.innerHTML = renderAddProfile(); break;
                case 'student-profile': app.innerHTML = renderStudentProfile(); break;
                case 'assess': app.innerHTML = renderAssess(); break;
                case 'emergency': app.innerHTML = renderEmergency(); break;
                case 'emergency_active': app.innerHTML = renderEmergencyActive(); break;
            }
            lucide.createIcons();
        }

        function renderLogin() {
            return `<div class="flex flex-col items-center justify-center flex-1 px-8 bg-white"><div class="w-20 h-20 bg-blue-600 rounded-[28px] flex items-center justify-center shadow-xl mb-8"><i data-lucide="heart-pulse" class="w-10 h-10 text-white"></i></div><h1 class="text-2xl font-black text-slate-900 mb-2 italic uppercase">4 Minutes SchoolCare</h1><p class="text-slate-400 mb-12 text-center text-sm font-medium italic">AI Health Monitor</p><div class="w-full space-y-4"><input type="text" placeholder="Access ID" class="w-full h-14 bg-slate-50 border rounded-2xl px-6 outline-none font-bold"><input type="password" placeholder="Password" class="w-full h-14 bg-slate-50 border rounded-2xl px-6 outline-none font-bold"><button onclick="navigate('dashboard')" class="w-full h-14 bg-blue-600 text-white rounded-2xl font-black shadow-lg">SIGN IN</button></div></div>`;
        }

        function renderDashboard() {
            return `<div class="px-6 pt-12 pb-8"><h2 class="text-2xl font-black text-slate-900 italic mb-10 tracking-tighter uppercase">Care Dashboard</h2><div class="grid grid-cols-2 gap-4 mb-8"><div onclick="navigate('assess', {assessmentLevel: 'mild'})" class="nav-card p-6 bg-white rounded-[32px] border shadow-sm flex flex-col items-center cursor-pointer active:scale-95 transition-all"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-4"><i data-lucide="thermometer" class="w-6 h-6"></i></div><span class="font-bold text-sm italic">Mild Care</span></div><div onclick="navigate('assess', {assessmentLevel: 'moderate'})" class="nav-card p-6 bg-white rounded-[32px] border shadow-sm flex flex-col items-center cursor-pointer active:scale-95 transition-all"><div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-4"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div><span class="font-bold text-sm italic">Moderate</span></div></div><div class="bg-blue-600 rounded-[32px] p-8 text-white mb-8 shadow-xl cursor-pointer active:scale-95 transition-all" onclick="navigate('add-profile')"><h3 class="text-xl font-black mb-1 italic uppercase">Add Profile</h3><p class="text-white/70 text-xs italic">Capture Biometric Data</p></div><h3 class="text-[11px] font-black text-slate-400 mb-5 uppercase ml-1">Added Students</h3><div class="space-y-4">${state.students.length === 0 ? '<div class="text-center p-10 text-slate-300 italic text-sm">No Cloud Data</div>' : state.students.map(s => `<div class="bg-white p-5 rounded-3xl border flex items-center shadow-sm"><div class="w-12 h-12 bg-slate-100 rounded-2xl overflow-hidden mr-4"><img src="${s.photo}" class="w-full h-full object-cover"></div><div><p class="font-black text-slate-900 uppercase italic text-sm">${s.name}</p><p class="text-[10px] text-slate-400 font-bold uppercase">Grade ${s.grade} • Room ${s.room}</p></div></div>`).join('')}</div></div>`;
        }

        function renderAddProfile() {
            return `<div class="min-h-screen bg-white flex flex-col"><div class="px-6 py-5 flex items-center border-b"><button onclick="navigate('dashboard')" class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center mr-4"><i data-lucide="arrow-left" class="w-5 h-5 text-slate-800"></i></button><h2 class="font-black text-lg italic uppercase">Biometric Registration</h2></div><div class="p-8 flex-1 space-y-6"><div class="flex flex-col items-center"><div class="w-40 h-40 rounded-[50px] bg-slate-50 border-4 shadow-2xl flex items-center justify-center overflow-hidden relative"><input type="file" accept="image/*" class="absolute inset-0 opacity-0 z-20 cursor-pointer" onchange="handleProfilePhoto(event)"><div id="profile-preview" class="w-full h-full flex flex-col items-center justify-center text-slate-300"><i data-lucide="camera" class="w-10 h-10 mb-2"></i><span class="text-[9px] font-black uppercase">Click Photo</span></div></div><p id="vector-status" class="text-[8px] text-blue-600 font-black uppercase mt-2 hidden">Biometrics Loaded</p></div><div class="space-y-3"><input type="text" id="reg-name" placeholder="Full Name" class="w-full h-14 bg-slate-50 border rounded-2xl px-6 font-bold text-sm"><div class="grid grid-cols-2 gap-3"><input type="text" id="reg-grade" placeholder="Grade" class="w-full h-14 bg-slate-50 border rounded-2xl px-6 font-bold text-sm"><input type="text" id="reg-room" placeholder="Room" class="w-full h-14 bg-slate-50 border rounded-2xl px-6 font-bold text-sm"></div><input type="text" id="reg-parent" placeholder="Parent Name" class="w-full h-14 bg-slate-50 border rounded-2xl px-6 font-bold text-sm"><input type="tel" id="reg-phone" placeholder="Phone Number" class="w-full h-14 bg-slate-50 border rounded-2xl px-6 font-bold text-sm"><textarea id="reg-diseases" placeholder="Condition History" class="w-full h-24 bg-slate-50 border rounded-2xl p-6 font-bold text-sm resize-none"></textarea><button id="save-btn" onclick="saveStudent()" class="w-full h-16 bg-blue-600 text-white rounded-[24px] font-black shadow-xl mt-6 italic tracking-widest uppercase">Secure Cloud Register</button></div></div></div>`;
        }

        function renderStudentProfile() {
            if (!state.uploadedPhoto) return `<div class="min-h-screen bg-slate-900 flex flex-col p-8 items-center justify-center"><div class="w-full aspect-square border-4 border-dashed border-white/10 rounded-[64px] flex flex-col items-center justify-center relative"><input type="file" accept="image/*" class="absolute inset-0 opacity-0 z-20 cursor-pointer" onchange="handleIdentification(event)"><div class="w-20 h-20 bg-blue-600 rounded-[32px] flex items-center justify-center mb-6 shadow-xl"><i data-lucide="upload" class="w-10 h-10 text-white"></i></div><p class="text-white text-xl font-black italic uppercase">Scan Student</p></div></div>`;
            if (state.topMatches.length > 0 && !state.selectedStudent) return `<div class="min-h-screen bg-white p-8"><h2 class="text-2xl font-black italic uppercase mb-8">AI Match Found</h2><div class="space-y-4">${state.topMatches.map(m => `<div onclick="finalizeSelection('${encodeURIComponent(JSON.stringify(m.student))}')" class="bg-slate-50 p-6 rounded-[32px] border flex items-center cursor-pointer active:scale-95 transition-all"><div class="w-14 h-14 rounded-2xl overflow-hidden mr-5 shadow-sm"><img src="${m.student.photo}" class="w-full h-full object-cover"></div><div class="flex-1"><p class="font-black text-sm uppercase italic">${m.student.name}</p><p class="text-[9px] text-blue-600 font-black italic">Confidence: ${Math.round(m.score * 100)}%</p></div></div>`).join('')}</div></div>`;
            return `<div class="min-h-screen bg-slate-50 pb-32"><div class="h-[300px] w-full bg-slate-200 overflow-hidden relative"><img src="${state.uploadedPhoto}" class="w-full h-full object-cover"><button onclick="window.navigate('student-profile', {uploadedPhoto: null, selectedStudent: null, topMatches: []})" class="absolute top-8 left-8 w-12 h-12 bg-white/80 backdrop-blur-md rounded-2xl flex items-center justify-center shadow-lg"><i data-lucide="arrow-left" class="w-6 h-6 text-slate-800"></i></button></div><div class="px-8 -mt-12 relative z-10"><div class="bg-white rounded-[40px] p-8 shadow-2xl border mb-8"><h2 class="text-3xl font-black italic mb-1 uppercase">${state.selectedStudent.name}</h2><p class="text-slate-400 font-black text-[10px] uppercase mb-6 tracking-widest italic">Grade ${state.selectedStudent.grade} • Room ${state.selectedStudent.room}</p><div class="bg-amber-50 p-4 rounded-2xl border border-amber-100"><p class="text-[9px] font-black text-amber-600 uppercase italic mb-1">Medical Condition</p><p class="text-xs font-bold text-amber-900 uppercase italic">${state.selectedStudent.diseases || 'STABLE'}</p></div></div><div class="space-y-6"><div><h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] ml-1 italic mb-4">AI Short Suggestion</h3><div id="ai-steps-list">${state.isAiLoading ? `<div class="h-20 shimmer rounded-[32px]"></div>` : state.aiSteps.map(step => `<div class="bg-white rounded-[32px] p-6 border shadow-sm italic text-xs font-bold text-slate-700 uppercase">${step}</div>`).join('')}</div></div><div class="bg-slate-900 rounded-[32px] p-8 text-white"><p class="text-[10px] font-black text-white/30 uppercase tracking-[0.3em] mb-4">Contact Parent</p><p class="font-black italic uppercase text-xs mb-1">${state.selectedStudent.parent}</p><p class="text-[10px] text-white/40 font-bold mb-6">${state.selectedStudent.phone}</p><a href="tel:${state.selectedStudent.phone}" class="w-full h-14 bg-red-600 rounded-2xl flex items-center justify-center font-black italic text-xs tracking-widest uppercase active:scale-95 transition-all">CALL PARENT</a></div></div></div></div>`;
        }

        window.handleProfilePhoto = async (event) => {
            const file = event.target.files[0]; if (!file || !state.isModelsLoaded) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const comp = await compressImage(e.target.result);
                const img = await faceapi.fetchImage(comp);
                const det = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                const preview = document.getElementById('profile-preview');
                if (det) {
                    preview.innerHTML = `<img src="${comp}" class="w-full h-full object-cover">`;
                    preview.dataset.photo = comp; preview.dataset.vector = JSON.stringify(Array.from(det.descriptor));
                    document.getElementById('vector-status').classList.remove('hidden');
                } else { alert("Face not detected. Use a clearer photo."); }
            };
            reader.readAsDataURL(file);
        };

        window.saveStudent = async () => {
            const getVal = (id) => document.getElementById(id).value;
            const preview = document.getElementById('profile-preview');
            const photo = preview?.dataset.photo, vector = JSON.parse(preview?.dataset.vector || '[]');
            if (!getVal('reg-name') || !photo || vector.length === 0) { alert("Missing Photo or Biometrics"); return; }
            const btn = document.getElementById('save-btn');
            btn.disabled = true; btn.innerText = "UPLOADING TO FIREBASE...";
            const s = { name: getVal('reg-name'), grade: getVal('reg-grade'), room: getVal('reg-room'), parent: getVal('reg-parent'), phone: getVal('reg-phone'), diseases: getVal('reg-diseases'), photo, faceVector: vector, timestamp: Date.now() };
            try {
                await addDoc(collection(db, "students"), s);
                await fetchStudents();
                navigate('dashboard');
            } catch (e) {
                alert("Firebase Rules Blocked Write. Please check Firestore Rules Tab.");
                btn.disabled = false; btn.innerText = "Secure Cloud Register";
            }
        };

        window.handleIdentification = (event) => {
            const file = event.target.files[0]; if (!file || !state.isModelsLoaded) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const comp = await compressImage(e.target.result);
                state.uploadedPhoto = comp; render();
                const img = await faceapi.fetchImage(comp);
                const det = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                if (!det) { alert("Face Recognition Failed."); state.uploadedPhoto = null; render(); return; }
                const inputDesc = det.descriptor;
                state.topMatches = state.students.map(s => {
                    if (!s.faceVector) return { student: s, score: 0 };
                    const dist = faceapi.euclideanDistance(inputDesc, new Float32Array(s.faceVector));
                    return { student: s, score: Math.max(0, 1 - dist) };
                }).sort((a, b) => b.score - a.score).slice(0, 3);
                render();
            };
            reader.readAsDataURL(file);
        };

        window.finalizeSelection = (enc) => { state.selectedStudent = JSON.parse(decodeURIComponent(enc)); state.isAiLoading = true; render(); runAiAnalysis(); };

        async function runAiAnalysis() {
            try {
                const model = genAI.getGenerativeModel({ model: "gemini-3.1-flash-lite-preview" });
                const prompt = `Student unwell. Give 3 simple tiny instructions. Max 4 words each. Numbered list only. No intro.`;
                const res = await model.generateContent(prompt);
                state.aiSteps = (await res.response.text()).split('\n').filter(l => l.trim()).map(l => l.replace(/^\d+[.\)]\s*/, '').trim()).slice(0, 3);
            } catch (err) { state.aiSteps = ["Monitor student clinic.", "Check forehead temperature.", "Call parent now."]; }
            finally { state.isAiLoading = false; render(); }
        }

        window.renderAssess = () => `<div class="min-h-screen bg-slate-50"><div class="bg-white px-6 py-5 flex items-center border-b"><button onclick="navigate('dashboard')" class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center mr-4"><i data-lucide="arrow-left" class="w-5 h-5 text-slate-800"></i></button><h2 class="font-black text-lg uppercase italic uppercase">${state.assessmentLevel} Protocol</h2></div><div class="p-8"><button onclick="navigate('student-profile')" class="w-full h-24 bg-blue-600 text-white rounded-[28px] font-black flex flex-col items-center justify-center shadow-xl italic tracking-tighter"><i data-lucide="scan" class="w-8 h-8 mb-1"></i><span>IDENTIFY STUDENT</span></button></div></div>`;
        window.renderEmergency = () => `<div class="px-8 pt-20 text-center flex-1"><div class="w-24 h-24 bg-red-50 text-red-600 rounded-[44px] mx-auto flex items-center justify-center mb-10 shadow-sm sos-pulse"><i data-lucide="shield-alert" class="w-12 h-12"></i></div><h2 class="text-4xl font-black text-slate-900 mb-2 uppercase italic tracking-tighter">SOS HUB</h2><div class="space-y-5"><button onclick="navigate('emergency_active', {type: 'SEIZURE'})" class="w-full p-8 bg-red-600 text-white rounded-[32px] flex items-center shadow-lg active:scale-95 transition-all"><div class="text-left font-black italic tracking-tighter text-xl uppercase">Seizure</div></button><button onclick="navigate('emergency_active', {type: 'ASTHMA'})" class="w-full p-8 bg-amber-500 text-white rounded-[32px] flex items-center shadow-lg active:scale-95 transition-all"><div class="text-left font-black italic tracking-tighter text-xl uppercase">Asthma</div></button></div></div>`;
        window.renderEmergencyActive = () => `<div class="min-h-screen bg-red-600 p-10 flex flex-col items-center justify-center text-center"><h2 class="text-7xl font-black text-white italic tracking-tighter mb-4 animate-pulse uppercase">SOS</h2><div class="w-full glass rounded-[40px] p-8 text-left border-none shadow-2xl"><p class="text-slate-800 font-bold italic text-sm mb-4">01. Clear the area.</p><p class="text-slate-800 font-bold italic text-sm mb-4">02. Stay with student.</p></div><button onclick="navigate('dashboard')" class="w-full h-20 bg-white text-red-600 rounded-[28px] font-black italic tracking-widest mt-12 uppercase">Dismiss</button></div>`;

        render();
    </script>
</body>
</html>
